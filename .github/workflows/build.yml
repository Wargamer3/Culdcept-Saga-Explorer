name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        required: true
        default: v1.0.0

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build "Culdcept Saga Explorer.sln" -c Release -p:CheckEolTargetFramework=false

  release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish
        run: dotnet publish "Culdcept Saga Explorer\Culdcept Saga Explorer.csproj" -c Release -r win-x64 --self-contained true -p:CheckEolTargetFramework=false -o publish
      - name: Pack
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: Compress-Archive -Path publish\* -DestinationPath "Culdcept-Saga-Explorer-$env:TAG-win-x64.zip"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: pwsh
        run: gh release upload $env:TAG "Culdcept-Saga-Explorer-$env:TAG-win-x64.zip" --clobber
